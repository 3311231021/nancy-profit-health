<head>

<body class="site-page compact-page">
<a class="skip-link" href="#main-content">跳至主要內容</a><header class="site-header"><a class="site-brand" href="dashboard.html" aria-label="ProFit Health 首頁"><svg class="brand-symbol" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="13" fill="#285b45"/><path d="M10 22h6l3-10 4 17 3-9h5" fill="none" stroke="#fffefa" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span><span class="brand-name">ProFit Health</span><span class="brand-caption">健康，從日常開始</span></span></a><nav class="site-nav" aria-label="主要導覽"><a href="dashboard.html">總覽</a><a href="activity.html">運動紀錄</a><a href="health_record.html">健康紀錄</a></nav></header>
<main id="main-content" class="app-main">


<h2>會員資料</h2>

<div id="info">讀取中...</div>

<br>
<button onclick="window.location.href='dashboard.html'">回首頁</button>

<script>
function safeText(v){return String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

async function loadUser() {
    const token = localStorage.getItem("token");
    if (!token) {
        alert("請先登入");
        window.location.href = "auth.html";
        return;
    }

    const res = await fetch("/api/me", {
        headers: { "Authorization": "Bearer " + token }
    });

    const data = await res.json();

    if (!res.ok) {
        alert(data.message);
        window.location.href = "auth.html";
        return;
    }

    document.getElementById("info").innerHTML = `
        <p>Email：${safeText(data.email)}</p>
        <p>顯示名稱：${safeText(data.username)}</p>
        <p>角色：${safeText(data.role)}</p>
        <p>註冊時間：${data.created_at}</p>
    `;
}

loadUser();
</script>

</main>
<footer class="site-footer"><span>ProFit Health · 陪你累積每一天的進步</span><span>運動紀錄 ／ 健康管理 ／ 專業陪伴</span></footer>
</body>
</html>
